components:
  schemas:
    SuccessResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "success"

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 错误码
          example: 40001
        message:
          type: string
          description: 错误信息
          example: "参数错误"

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: "admin"
        password:
          type: string
          minLength: 8
          maxLength: 100
          example: "password123"

    LoginResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "登录成功"
        data:
          type: object
          required:
            - token
            - expires_at
            - user
          properties:
            token:
              type: string
              description: JWT令牌
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            expires_at:
              type: string
              format: date-time
              description: 令牌过期时间
              example: "2026-06-06T00:00:00Z"
            user:
              $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      required:
        - id
        - username
        - role
        - groups
      properties:
        id:
          type: string
          description: 用户ID（雪花ID）
          pattern: '^\d{19}$'
          example: "1234567890123456789"
        username:
          type: string
          example: "admin"
        role:
          type: string
          enum: [admin, manager, executive]
          example: "admin"
        groups:
          type: array
          items:
            type: string
          description: 用户组ID列表
          example: ["1234567890123456789"]

    UserResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "success"
        data:
          type: object
          required:
            - id
            - username
            - email
            - role
            - groups
            - status
            - created_at
          properties:
            id:
              type: string
              pattern: '^\d{19}$'
            username:
              type: string
            email:
              type: string
              format: email
            role:
              type: string
              enum: [admin, manager, executive]
            groups:
              type: array
              items:
                type: string
            status:
              type: integer
              enum: [0, 1]
            created_at:
              type: string
              format: date-time

    UserListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "success"
        data:
          type: object
          required:
            - total
            - page
            - page_size
