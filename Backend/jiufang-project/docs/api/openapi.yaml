openapi: 3.0.3
info:
  title: 九方智能查询系统 API
  description: |
    九方智能查询系统是一个基于AI Agent的自然语言查询系统，支持用户通过自然语言查询ERP数据，
    并提供定时报告、预警规则、数据导出等功能。
    
    ## 认证方式
    - 使用JWT Bearer Token认证
    - 登录接口获取JWT令牌
    - 令牌有效期24小时
    
    ## 权限控制
    - admin: 系统管理员，拥有所有权限
    - manager: 管理层，拥有查询和导出权限
    - executive: 执行层，拥有查询权限
    
    ## 响应格式
    所有接口统一使用以下响应格式：
    ```json
    {
      "code": 200,
      "message": "success",
      "data": {}
    }
    ```
  version: 1.0.0
  contact:
    name: 九方技术团队
    email: tech@jiufang.com

servers:
  - url: https://api.jiufang.com/v1
    description: 生产环境
  - url: https://api-dev.jiufang.com/v1
    description: 开发环境
  - url: http://localhost:8080/api/v1
    description: 本地开发环境

tags:
  - name: Auth
    description: 认证相关接口
  - name: User
    description: 用户管理接口（仅管理员）
  - name: Group
    description: 用户组管理接口（仅管理员）
  - name: Query
    description: 自然语言查询接口
  - name: History
    description: 查询历史记录接口
  - name: Favorite
    description: 收藏管理接口
  - name: DialogFavorite
    description: 对话收藏管理接口
  - name: Export
    description: 数据导出接口
  - name: Report
    description: 定时报告管理接口（仅管理员）
  - name: Alert
    description: 预警规则管理接口（仅管理员）
  - name: Feedback
    description: 反馈管理接口
  - name: Log
    description: 操作日志接口（仅管理员）
  - name: Profile
    description: 个人资料管理接口

paths:
  # ==================== 认证模块 ====================
  /auth/login:
    post:
      tags:
        - Auth
      summary: 用户登录
      description: 用户使用用户名和密码登录，返回JWT令牌
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: "admin"
              password: "password123"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                code: 200
                message: "登录成功"
                data:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  expires_at: "2026-06-06T00:00:00Z"
                  user:
                    id: "1234567890123456789"
                    username: "admin"
                    role: "admin"
                    groups: ["group1", "group2"]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 40101
                message: "用户名或密码错误"
        '403':
          description: 用户已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 40301
                message: "用户已停用"

  /auth/logout:
    post:
      tags:
        - Auth
      summary: 用户登出
      description: 用户登出，清除JWT令牌
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                code: 200
                message: "登出成功"
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== 用户管理模块 ====================
  /users:
    post:
      tags:
        - User
      summary: 创建用户
      description: 创建新用户（仅系统管理员可操作）
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - email
                - role
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                password:
                  type: string
                  minLength: 8
                  maxLength: 100
                email:
                  type: string
                  format: email
                  maxLength: 100
                role:
                  type: string
                  enum: [admin, manager, executive]
                groups:
                  type: array
                  items:
                    type: string
                status:
                  type: integer
                  enum: [0, 1]
                  default: 1
            example:
              username: "newuser"
              password: "password123"
              email: "newuser@example.com"
              role: "manager"
              groups: ["1234567890123456789"]
              status: 1
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 用户名或邮箱已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - User
      summary: 查询用户列表
      description: 分页查询用户列表（仅系统管理员可操作）
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: username
          in: query
          schema:
            type: string
            maxLength: 50
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, manager, executive]
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{user_id}:
    get:
      tags:
        - User
      summary: 查询用户详情
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{19}$'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - User
      summary: 更新用户
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{19}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                password:
                  type: string
                  minLength: 8
                  maxLength: 100
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [admin, manager, executive]
                groups:
                  type: array
                  items:
                    type: string
                status:
                  type: integer
                  enum: [0, 1]
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - User
      summary: 删除用户
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{19}$'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== 查询模块 ====================
  /query:
    post:
      tags:
        - Query
      summary: 自然语言查询
      description: 执行自然语言查询，支持对话上下文和权限过滤
      operationId: executeQuery
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - input
              properties:
                input:
                  type: string
                  minLength: 1
                  maxLength: 500
                session_id:
                  type: string
                  pattern: '^\d{19}$'
                execute_immediately:
                  type: boolean
                  default: true
            example:
              input: "查询上个月的销售额"
              session_id: "1234567890123456789"
              execute_immediately: true
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== 用户组管理模块 ====================
  /groups:
    post:
      tags:
        - Group
      summary: 创建用户组
      description: 创建新用户组（仅系统管理员可操作）
      operationId: createGroup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      tags:
        - Group
      summary: 查询用户组列表
      description: 分页查询用户组列表（仅系统管理员可操作）
      operationId: listGroups
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /groups/{group_id}:
    get:
      tags:
        - Group
      summary: 查询用户组详情
      description: 查询单个用户组详情（仅系统管理员可操作）
      operationId: getGroup
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{19}$'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Group
      summary: 更新用户组
      description: 更新用户组信息（仅系统管理员可操作）
      operationId: updateGroup
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{19}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Group
      summary: 删除用户组
      description: 删除用户组（仅系统管理员可操作）
      operationId: deleteGroup
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{19}$'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /groups/{group_id}/permissions:
    post:
      tags:
        - Group
      summary: 配置用户组权限
      description: 配置用户组权限（仅系统管理员可操作）
      operationId: configurePermissions
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{19}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permissions
              properties:
                permissions:
                  type: array
                  items:
                    type: object
                    required:
                      - table_name
                      - allowed_fields
                    properties:
                      table_name:
                        type: string
                        minLength: 1
                        maxLength: 100
                      allowed_fields:
                        type: string
                        description: JSON数组格式
                      filter_condition:
                        type: string
      responses:
        '200':
          description: 配置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags:
        - Group
      summary: 查询用户组权限
      description: 查询用户组权限配置（仅系统管理员可操作）
      operationId: getPermissions
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{19}$'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /groups/{group_id}/members:
    get:
      tags:
        - Group
      summary: 查询用户组成员
      description: 查询用户组成员列表（仅系统管理员可操作）
      operationId: getGroupMembers
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{19}$'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags:
        - Group
      summary: 添加用户组成员
      description: 添加用户组成员（仅系统管理员可操作）
      operationId: addGroupMembers
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{19}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_ids
              properties:
                user_ids:
                  type: array
                  items:
                    type: string
                    pattern: '^\d{19}$'
      responses:
        '200':
          description: 添加成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /groups/{group_id}/members/{user_id}:
    delete:
      tags:
        - Group
      summary: 删除用户组成员
      description: 删除用户组成员（仅系统管理员可操作）
      operationId: removeGroupMember
      security:
        - bearerAuth: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{19}$'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{19}$'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== 历史记录模块 ====================
  /history:
    get:
      tags:
        - History
      summary: 查询历史列表
      description: 分页查询用户的查询历史记录
      operationId: getHistoryList
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /history/{record_id}:
    get:
      tags:
        - History
      summary: 查询历史详情
      description: 查询历史记录详情
      operationId: getHistoryDetail
      security:
        - bearerAuth: []
      parameters:
        - name: record_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{19}$'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - History
      summary: 删除查询历史
      description: 删除历史记录
      operationId: deleteHistory
      security:
        - bearerAuth: []
      parameters:
        - name: record_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{19}$'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== 收藏模块 ====================
  /favorites:
    post:
      tags:
        - Favorite
      summary: 创建收藏
      description: 创建查询记录收藏
      operationId: createFavorite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - record_id
              properties:
                record_id:
                  type: string
                  pattern: '^\d{19}$'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags:
        - Favorite
      summary: 查询收藏列表
      description: 分页查询用户的收藏列表
      operationId: getFavoriteList
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /favorites/{favorite_id}:
    delete:
      tags:
